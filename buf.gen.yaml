version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/aamirlatif1/warden/gen
plugins:
  # Local plugins, installed into ./bin by `make proto-tools`.
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
